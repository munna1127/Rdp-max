name: Windows-RDP-Pinggy

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Windows RDP & Set Password
      shell: cmd
      run: |
        reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
        netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
        net user runneradmin TomarJi99!

    - name: Start Pinggy TCP Tunnel
      shell: cmd
      run: |
        echo Tunnel start ho raha hai, 20 seconds wait karein...
        start /b ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R 0:127.0.0.1:3389 tcp@free.pinggy.io > pinggy.log 2>&1
        ping 127.0.0.1 -n 21 >nul
        echo ========================================
        type pinggy.log
        echo ========================================
        echo USERNAME: runneradmin
        echo PASSWORD: TomarJi99!
        echo ========================================

    - name: Keep Alive Loop
      shell: cmd
      run: |
        for /L %%i in (1,1,360) do (
            ping 127.0.0.1 -n 61 >nul
            echo Active: %%i min
        )
        
