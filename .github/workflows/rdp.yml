name: Windows-RDP-Pinggy

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Windows RDP & Set Password
      shell: cmd
      run: |
        reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
        netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
        net user runneradmin TomarJi99!

    - name: Start Pinggy TCP Tunnel
      shell: powershell
      run: |
        $job = Start-Job -ScriptBlock {
            ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:127.0.0.1:3389 tcp@free.pinggy.io 2>&1
        }
        
        Write-Host "Tunnel connect ho raha hai, 15 seconds wait karein..."
        Start-Sleep -Seconds 15
        
        $output = Receive-Job -Job $job -Keep
        Write-Host "========================================"
        if ($output) {
            $output | ForEach-Object { Write-Host $_ }
        } else {
            Write-Host "Tunnel connection established. Check URL above."
        }
        Write-Host "========================================"
        Write-Host "USERNAME: runneradmin"
        Write-Host "PASSWORD: TomarJi99!"
        Write-Host "========================================"

    - name: Keep Alive Loop
      shell: cmd
      run: |
        for /L %%i in (1,1,360) do (
            ping 127.0.0.1 -n 61 >nul
            echo Active: %%i min
        )
        
