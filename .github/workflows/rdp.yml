name: Windows-RDP-Ngrok

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Windows RDP & Set Password
      shell: cmd
      run: |
        reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
        netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
        net user runneradmin TomarJi99!

    - name: Download & Setup Ngrok
      shell: cmd
      run: |
        curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -o ngrok.zip
        tar -xf ngrok.zip
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Start Ngrok TCP Tunnel
      shell: cmd
      run: |
        start /b ngrok tcp 3389 > ngrok.log 2>&1
        ping 127.0.0.1 -n 12 >nul
        echo ========================================
        type ngrok.log
        echo ========================================
        echo USERNAME: runneradmin
        echo PASSWORD: TomarJi99!
        echo ========================================

    - name: Keep Alive Loop
      shell: cmd
      run: |
        for /L %%i in (1,1,360) do (
            ping 127.0.0.1 -n 61 >nul
            echo Active: %%i min
        )
        
