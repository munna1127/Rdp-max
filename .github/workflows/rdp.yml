name: Windows-RDP-Pinggy

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Windows RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Set Custom RDP Password
      run: |
        net user runneradmin TomarJi99!

    - name: Start Pinggy Tunnel
      run: |
        Invoke-WebRequest -Uri "https://github.com/Pinggy-io/pinggy-cli/releases/latest/download/pinggy_windows_amd64.zip" -OutFile "pinggy.zip"
        Expand-Archive pinggy.zip -DestinationPath .
        
        $process = Start-Process -FilePath ".\pinggy.exe" -ArgumentList "tcp 3389" -PassThru -NoNewWindow
        Start-Sleep -Seconds 10
        
        # Web UI se tunnel address fetch karna
        try {
            $status = Invoke-RestMethod -Uri "http://localhost:4300/status"
            Write-Host "========================================"
            Write-Host "RDP ADDRESS: $($status.urls[0] -replace 'tcp://','')"
            Write-Host "USERNAME:    runneradmin"
            Write-Host "PASSWORD:    TomarJi99!"
            Write-Host "========================================"
        } catch {
            Write-Host "Tunnel address fetch karne me issue aaya. Fallback SSH try kar rahe hain:"
            cmd.exe /c "pinggy.exe -version"
        }

    - name: Keep Alive Loop
      run: |
        $i = 1
        while ($i -le 360) {
            Start-Sleep -Seconds 60
            $i++
        }
