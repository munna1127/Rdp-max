name: Windows-RDP-Pinggy

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Windows RDP & Set Password
      shell: cmd
      run: |
        reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
        netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
        net user runneradmin TomarJi99!

    - name: Start Pinggy TCP Tunnel
      shell: cmd
      run: |
        start /b ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R0:localhost:3389 tcp@free.pinggy.io > pinggy.log 2>&1
        timeout /t 12 /nobreak >nul
        type pinggy.log

    - name: Keep Alive Loop
      shell: cmd
      run: |
        for /L %%i in (1,1,360) do (
            timeout /t 60 /nobreak >nul
            echo Active: %%i min
        )
        
