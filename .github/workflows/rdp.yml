name: Windows-RDP-Pinggy

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Windows RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Set Custom RDP Password
      run: |
        net user runneradmin TomarJi99!

    - name: Start Pinggy TCP Tunnel
      run: |
        # SSH background process start karo aur output capture karo
        Start-Process ssh -ArgumentList "-o StrictHostKeyChecking=no -p 443 -R0:localhost:3389 tcp@free.pinggy.io" -RedirectStandardOutput "pinggy.log" -RedirectStandardError "pinggy_err.log"
        
        # Address generate hone ka wait karo
        Start-Sleep -Seconds 12
        
        Write-Host "========================================"
        Get-Content pinggy.log -ErrorAction SilentlyContinue
        Get-Content pinggy_err.log -ErrorAction SilentlyContinue
        Write-Host "========================================"
        Write-Host "USERNAME: runneradmin"
        Write-Host "PASSWORD: TomarJi99!"
        Write-Host "========================================"

    - name: Keep Alive Loop
      run: |
        $i = 1
        while ($i -le 360) {
            Start-Sleep -Seconds 60
            $i++
        }
        
